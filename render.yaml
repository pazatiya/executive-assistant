# Render Blueprint — המזכירה + WAHA.
# Render → New → Blueprint → pick this repo → Apply.
# Then set the sync:false env vars in the dashboard (see DEPLOY.md).
#
#  - executive-assistant   web, FREE instance (kept warm by UptimeRobot).
#                          DB is external (Turso) so it survives spin-down.
#  - dalor-waha            WAHA (WhatsApp), Starter ($7) + 1GB disk for the
#                          linked session. Must never sleep.
#  - executive-assistant-tick   cron, every 5 min → scheduler/reminders.

services:
  # ── the assistant (app) — free ────────────────────────────────────
  - type: web
    name: executive-assistant
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:push && SEED_DEMO=0 npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/ai/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_DRIVER
        value: libsql
      - key: LIBSQL_URL
        sync: false # libsql://<db>-<org>.turso.io?authToken=<token>  (Turso free)
      - key: AUTH_DRIVER
        value: dev
      - key: AI_DEFAULT_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash-lite
      - key: APP_TIMEZONE
        value: Asia/Jerusalem
      - key: ASSISTANT_MODE
        value: draft_only
      - key: WHATSAPP_OWNER_EMAIL
        value: yair@dalor.co.il
      - key: WHATSAPP_WORKSPACE_SLUG
        value: dalor
      - key: DALOR_BARBER_URL
        value: https://dalorbook.duckdns.org
      - key: WA_COUNTRY_CODE
        value: "972"
      - key: WAHA_SESSION
        value: default
      # ── secrets / per-deploy ────────────────────────────────────
      - key: APP_URL
        sync: false # https://executive-assistant.onrender.com
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DALOR_BARBER_ADMIN_KEY
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:dalor@dalor.co.il
      - key: WAHA_API_KEY
        sync: false # same value as dalor-waha's WAHA_API_KEY
      - key: WAHA_WEBHOOK_SECRET
        sync: false # any strong string; the assistant embeds it in the webhook URL
      - key: WAHA_BASE_URL
        fromService:
          type: web
          name: dalor-waha
          property: hostport
        # → "dalor-waha:PORT" on the private network; the code prefixes http://

  # ── WAHA (WhatsApp) — paid, always on ─────────────────────────────
  - type: web
    name: dalor-waha
    runtime: image
    plan: starter
    image:
      url: docker.io/devlikeapro/waha:latest
    autoDeploy: false
    disk:
      name: waha-sessions
      mountPath: /app/.sessions
      sizeGB: 1
    envVars:
      - key: WAHA_API_KEY
        sync: false # generate a strong key; put the SAME value on executive-assistant
      - key: WHATSAPP_API_KEY
        sync: false # = WAHA_API_KEY (WAHA reads either)
      - key: WHATSAPP_DEFAULT_ENGINE
        value: NOWEB
      - key: WAHA_DASHBOARD_ENABLED
        value: "false"
      - key: WHATSAPP_RESTART_ALL_SESSIONS
        value: "true"

  # ── heartbeat ────────────────────────────────────────────────────
  - type: cron
    name: executive-assistant-tick
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: curl -fsS -X POST "$TICK_URL/api/scheduler/tick?secret=$CRON_SECRET" || true
    envVars:
      - key: TICK_URL
        sync: false # = executive-assistant APP_URL
      - key: CRON_SECRET
        sync: false # = executive-assistant CRON_SECRET
