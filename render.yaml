# Render Blueprint — המזכירה + WAHA.
# Render → New → Blueprint → pick this repo → Apply.
# Then set the sync:false env vars in the dashboard (see DEPLOY.md).
#
#  - executive-assistant   web, FREE instance (kept warm by UptimeRobot).
#                          DB is external (Turso) so it survives spin-down.
#  - dalor-waha            WAHA (WhatsApp), Starter ($7) + 1GB disk for the
#                          linked session. Must never sleep.
#  - executive-assistant-tick   cron, every 5 min → scheduler/reminders.

services:
  # ── the assistant (app) — free ────────────────────────────────────
  - type: web
    name: executive-assistant
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Schema + seed are applied to Turso manually from a dev machine
    #   (npm run db:push / npm run db:seed with LIBSQL_URL + LIBSQL_AUTH_TOKEN).
    # Free-tier services don't support preDeployCommand.
    startCommand: npm start
    healthCheckPath: /api/ai/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_DRIVER
        value: libsql
      - key: LIBSQL_URL
        sync: false # libsql://<db>-<org>.turso.io   (Turso free, no token in URL)
      - key: LIBSQL_AUTH_TOKEN
        sync: false # the Turso database token (Create Token in the Turso dashboard)
      - key: AUTH_DRIVER
        value: dev
      - key: AI_DEFAULT_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash # customer replies + orchestrator (warm tone, reasoning). Triage stays on flash-lite.
      - key: APP_TIMEZONE
        value: Asia/Jerusalem
      - key: ASSISTANT_MODE
        value: draft_only
      - key: WHATSAPP_OWNER_EMAIL
        value: yair@dalor.co.il
      - key: WHATSAPP_WORKSPACE_SLUG
        value: dalor
      - key: OWNER_WHATSAPP
        sync: false # "email:number,email:number" — enables owner WhatsApp commands + alerts
      - key: DALOR_BARBER_URL
        value: https://dalorbook.duckdns.org
      - key: APPT_REMINDER_LEAD_HOURS
        value: "3.5"
      - key: WA_COUNTRY_CODE
        value: "972"
      - key: WAHA_SESSION
        value: default
      # ── secrets / per-deploy ────────────────────────────────────
      - key: APP_URL
        sync: false # https://executive-assistant.onrender.com
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DALOR_BARBER_ADMIN_KEY
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: VAPID_PUBLIC
        sync: false
      - key: VAPID_PRIVATE
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:dalor@dalor.co.il
      - key: WAHA_API_KEY
        sync: false # same value as dalor-waha's WAHA_API_KEY
      - key: WAHA_WEBHOOK_SECRET
        sync: false # any strong string; the assistant embeds it in the webhook URL
      # ── official WhatsApp (Meta Cloud API) — set these and Meta wins over WAHA ──
      - key: META_WA_TOKEN
        sync: false # permanent system-user access token
      - key: META_WA_PHONE_NUMBER_ID
        sync: false # from the WhatsApp → API Setup screen
      - key: META_WA_VERIFY_TOKEN
        sync: false # any string you choose; echoed in the webhook GET challenge
      - key: META_APP_SECRET
        sync: false # Meta app → Settings → Basic → App Secret
      - key: WAHA_BASE_URL
        fromService:
          type: web
          name: dalor-waha
          property: hostport
        # → "dalor-waha:PORT" on the private network; the code prefixes http://

  # ── WAHA (WhatsApp) — paid, always on ─────────────────────────────
  - type: web
    name: dalor-waha
    runtime: image
    plan: starter
    image:
      url: docker.io/devlikeapro/waha:latest
    autoDeploy: false
    disk:
      name: waha-sessions
      mountPath: /app/.sessions
      sizeGB: 1
    envVars:
      - key: WAHA_API_KEY
        sync: false # generate a strong key; put the SAME value on executive-assistant
      - key: WHATSAPP_API_KEY
        sync: false # = WAHA_API_KEY (WAHA reads either)
      - key: WHATSAPP_DEFAULT_ENGINE
        value: NOWEB
      - key: WAHA_DASHBOARD_ENABLED
        value: "false"
      - key: WHATSAPP_RESTART_ALL_SESSIONS
        value: "true"

  # ── heartbeat ────────────────────────────────────────────────────
  # No paid Render cron. A free UptimeRobot HTTP monitor hits
  #   https://<app>.onrender.com/api/scheduler/tick?secret=<CRON_SECRET>
  # every 5 minutes — that fires the scheduler AND keeps the free web
  # instance warm. See DEPLOY.md §3.
